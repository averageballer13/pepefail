<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pepe.fail — Casino</title>
  <link rel="icon" type="image/png" href="assets/img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/glass.css" />
  <link rel="stylesheet" href="assets/css/anim.css" />
  <link rel="stylesheet" href="assets/css/play.css" />
  <link rel="stylesheet" href="assets/css/modal.css" />
  <link rel="stylesheet" href="assets/css/loader.css" />
</head>
<body>

  <!-- Entry loader: shown once per session, or when arriving from the
       landing. The decision runs inline so a repeat visit never flashes. -->
  <div class="loader" id="loader" aria-hidden="true">
    <img class="loader__logo" src="assets/img/logo.png" alt="" />
    <div class="loader__word">pepe<b>.fail</b></div>
    <div class="loader__track"><div class="loader__fill"></div></div>
    <div class="loader__pct">0%</div>
  </div>
  <script>
    (function () {
      var KEY = "pepe.entered";
      var fromLanding = /(^|\/)(index\.html)?$/.test(
        (function () { try { return new URL(document.referrer).pathname; } catch (e) { return "x"; } })()
      ) && document.referrer.indexOf(location.origin) === 0;
      var first = false;
      try { first = !sessionStorage.getItem(KEY); sessionStorage.setItem(KEY, "1"); } catch (e) {}
      if (fromLanding || first) document.getElementById("loader").classList.add("is-on");
    })();
  </script>

  <div class="app">
    <main class="main">
      <div class="main__inner">

        <!-- HERO -->
        <section class="hero">
          <div class="hero__banner">
            <h1 class="hero__title">Play Without <b>Limits</b> with the Frog</h1>
            <p class="hero__sub">Slots, original games and live tables. Join the horde and try your luck.</p>
            <div class="hero__cta" style="flex-wrap:wrap;row-gap:12px">
              <button class="btn btn--gold btn--lg" id="heroWallet">Create Wallet</button>
              <a class="btn btn--glass btn--lg" href="#originals">Browse Games</a>
            </div>
          </div>
        </section>

        <!-- ORIGINALS -->
        <section class="section">
          <div class="section__head">
            <h2 class="section__title"><span class="ico" data-ico="diamond"></span>Originals</h2>
            <div class="section__nav">
              <button data-scroll="originals" data-dir="-1" data-ico="arrowL" title="Scroll left"></button>
              <button data-scroll="originals" data-dir="1" data-ico="arrowR" title="Scroll right"></button>
            </div>
          </div>
          <div class="game-row" id="originals"></div>
        </section>

        <!-- CTA -->
        <div class="cta-strip">
          <img src="assets/img/logo.png" alt="pepe.fail" />
          <div>
            <div class="cta-strip__t">Join the golden Frog horde</div>
            <div class="cta-strip__s">Create a wallet and start playing.</div>
          </div>
          <button class="btn btn--gold btn--lg" id="ctaWallet">Create Wallet</button>
        </div>

        <div class="foot"></div>

      </div>
    </main>
  </div>

  <script src="assets/js/loader.js"></script>
  <script>window.PAGE = { active: "home", base: "" };</script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/sfx.js"></script>
  <script src="assets/js/engine.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/games-data.js"></script>
  <script src="assets/js/modal.js"></script>
  <script src="assets/js/wallet.js"></script>
  <script src="assets/js/realmode.js"></script>
  <script src="assets/js/wallet-panel.js"></script>
  <script src="assets/js/topbar-modals.js"></script>
  <script src="assets/js/anim.js"></script>
  <script src="assets/js/casino.js"></script>
</body>
</html>
