<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Promotions — pepe.fail</title>
  <link rel="icon" type="image/png" href="../assets/img/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/glass.css" />
  <link rel="stylesheet" href="../assets/css/anim.css" />
  <link rel="stylesheet" href="../assets/css/play.css" />
  <link rel="stylesheet" href="../assets/css/modal.css" />
</head>
<body>
  <div class="app">
    <main class="main">
      <div class="main__inner">

        <div class="page-head">
          <h1><span style="display:inline-grid;place-items:center;width:34px;height:34px;vertical-align:-6px;color:var(--gold);margin-right:6px" data-ico="gift"></span>Promotions</h1>
          <p>Races, challenges and rewards — there is always something to win on pepe.fail.</p>
        </div>

        <div class="promo-grid" id="promos"></div>

        <section class="section">
          <div class="section__head">
            <h2 class="section__title"><span class="ico" data-ico="crown"></span>VIP Tiers</h2>
          </div>
          <div class="vip-row" id="vips"></div>
        </section>

        <div class="cta-strip" style="margin-top:30px">
          <img src="../assets/img/logo.png" alt="pepe.fail" />
          <div>
            <div class="cta-strip__t">Nothing running yet</div>
            <div class="cta-strip__s">Races and rewards go live once the casino launches.</div>
          </div>
          <a class="btn btn--gold btn--lg" href="../casino.html#originals">Play now</a>
        </div>

        <div class="foot">
          © 2026 pepe.fail — Casino<br>
          Play responsibly · 18+
        </div>

      </div>
    </main>
  </div>

  <script>window.PAGE = { active: "vip", base: "../" };</script>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/engine.js"></script>
  <script src="../assets/js/shell.js"></script>
  <script src="../assets/js/games-data.js"></script>
  <script src="../assets/js/modal.js"></script>
  <script src="../assets/js/wallet.js"></script>
  <script src="../assets/js/wallet-panel.js"></script>
  <script src="../assets/js/anim.js"></script>
  <script>
    hydrateIcons();

    /* Promotion cards */
    const PROMOS = [
      { ic: "trophy", t: "Daily Race", s: "Climb the leaderboard every day and share the prize pool.", amt: "$0", timer: "Soon", ac: "" },
      { ic: "trophy", t: "Weekly Race", s: "One week, one leaderboard, one big pool to share.", amt: "$0", timer: "Soon", ac: "orange" },
      { ic: "diamond", t: "Monthly Race", s: "The biggest race of the month for the most active players.", amt: "$0", timer: "Soon", ac: "" },
      { ic: "ticket", t: "Weekly Draw", s: "One ticket for every bet you place. Drawn every Sunday.", amt: "$0", timer: "Soon", ac: "orange" },
      { ic: "target", t: "Challenges", s: "Daily objectives on your favorite games, instant payouts.", amt: "$0", timer: "Soon", ac: "" },
      { ic: "coin", t: "Rakeback", s: "Get a share of every bet back, win or lose.", amt: "$0", timer: "Soon", ac: "orange" },
    ];

    document.getElementById("promos").innerHTML = PROMOS.map(function (p) {
      return '<div class="pcard ' + (p.ac ? "pcard--orange" : "") + '">' +
        '<div class="pcard__ico">' + icon(p.ic) + '</div>' +
        '<div class="pcard__t">' + p.t + '</div>' +
        '<div class="pcard__s">' + p.s + '</div>' +
        '<div class="pcard__foot"><span class="pcard__amt">' + p.amt + '</span>' +
        '<span class="pcard__timer">' + p.timer + '</span></div>' +
      '</div>';
    }).join("");

    /* VIP ladder */
    const VIPS = [
      { n: "Tadpole", w: "$0", ic: "chip", cur: true },
      { n: "Frog", w: "$0", ic: "frog" },
      { n: "Golden Frog", w: "$0", ic: "star" },
      { n: "King Pepe", w: "$0", ic: "crown" },
      { n: "Legend", w: "$0", ic: "diamond" },
    ];

    document.getElementById("vips").innerHTML = VIPS.map(function (v) {
      return '<div class="vip ' + (v.cur ? "cur" : "") + '">' +
        '<div class="vip__ico">' + icon(v.ic) + '</div>' +
        '<div class="vip__n">' + v.n + '</div>' +
        '<div class="vip__w">' + v.w + ' wagered</div>' +
      '</div>';
    }).join("");

  </script>
</body>
</html>
